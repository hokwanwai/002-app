<!DOCTYPE html>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="沙田格價">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans HK', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #f4f6f8;
      color: #0f172a;
    }
    .touch-target {
      min-height: 40px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#f4f6f8] text-slate-900 pb-36 antialiased selection:bg-emerald-600 selection:text-white">

  <!-- Subtle Floating Toast -->
  <div id="app-toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg hidden transition-all w-11/12 max-w-xs text-center">
    <span id="app-toast-text">已更新清單</span>
  </div>

  <!-- Mobile App Container -->
  <div class="max-w-md mx-auto min-h-screen bg-[#f4f6f8] flex flex-col relative sm:border-x sm:border-slate-200/80 sm:shadow-sm">

    <!-- Sticky Header: District + Store Brand + Category Filter -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/90 px-3.5 pt-2.5 pb-2 space-y-2 shadow-2xs">
      <!-- Row 1: Friendly Title + Search Input + Discreet Settings Button -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0 shrink-0">
          <div class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-base shadow-2xs shrink-0">🛒</div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-sm font-extrabold tracking-tight text-slate-900 whitespace-nowrap">沙田街坊格價</h1>
              <span id="db-mode-badge" class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold px-1.5 py-0.5 rounded-md whitespace-nowrap">雲端已連通</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 flex-1 max-w-[180px]">
          <input type="search" id="search-input" oninput="onSearchInput(this.value)" placeholder="搜尋薯片、米、啤酒..." class="w-full bg-slate-100 focus:bg-white border border-transparent focus:border-slate-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 placeholder:text-slate-400 focus:outline-none transition">
          <button onclick="openBackendModal()" title="雲端設定" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-slate-600 flex items-center justify-center text-xs shrink-0 transition">
            ⚙️
          </button>
        </div>
      </div>

      <!-- Row 2: 地區選擇 (Estate / Area Selector) -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <span class="text-[11px] font-bold text-slate-400 shrink-0 pr-0.5">地區:</span>
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar" id="area-bar"></div>
      </div>

      <!-- Row 3: 商舖選擇 (Store Brand Selector - Wellcome, 360, 759, 7-11, Market/Pharmacy) -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <span class="text-[11px] font-bold text-slate-400 shrink-0 pr-0.5">商舖:</span>
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar" id="chain-bar"></div>
      </div>

      <!-- Row 4: 貨品分類與排序 -->
      <div class="flex items-center justify-between gap-2 pt-0.5 border-t border-slate-100">
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar" id="category-bar"></div>
        <button onclick="cycleSortMode()" id="sort-btn" class="text-[11px] font-bold text-slate-700 bg-slate-100 hover:bg-slate-200/70 px-2.5 py-1 rounded-lg whitespace-nowrap shrink-0 transition">
          <span id="sort-label">按最抵買</span>
        </button>
      </div>
    </header>

    <!-- Active Shopper Context Banner (Tells user what mode they are in) -->
    <section id="shopper-mode-banner" class="px-3.5 mt-2.5">
      <div id="shopper-mode-box" class="bg-emerald-50/90 border border-emerald-200/90 rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2">
        <div class="min-w-0">
          <div class="text-xs font-extrabold text-emerald-950" id="shopper-mode-title">全區格價視角（揀上面「地區」或「商舖」即睇單店買邊樣最抵）</div>
          <div class="text-[11px] text-emerald-800/90 mt-0.5" id="shopper-mode-subtitle">不用為慳一蚊走三間舖！揀你身處嘅商舖，即睇邊樣「順手買埋」、邊樣「過隔離舖買」。</div>
        </div>
        <button onclick="resetFilters()" id="reset-filter-btn" class="hidden text-[11px] font-bold bg-white text-slate-700 border border-slate-200 px-2.5 py-1 rounded-lg whitespace-nowrap shrink-0">
          重設
        </button>
      </div>
    </section>

    <!-- Live Cloud Community Price Feed (Reads directly from Supabase staging_queue!) -->
    <section id="cloud-feed-section" class="px-3.5 mt-2.5 hidden">
      <div class="bg-white border border-slate-200/90 rounded-2xl p-3 shadow-2xs space-y-1.5">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span class="text-xs font-extrabold text-slate-800">街坊現場最新報價 (雲端實時同步)</span>
          </div>
          <button onclick="openReportModal()" class="text-[11px] font-bold text-emerald-700 hover:underline whitespace-nowrap">＋ 我又要報價</button>
        </div>
        <div id="cloud-feed-list" class="flex gap-2 overflow-x-auto no-scrollbar pt-0.5"></div>
      </div>
    </section>

    <!-- Personal Footprint Banner (Collapsible / Compact) -->
    <section id="footprint-section" class="px-3.5 mt-2.5 hidden">
      <div class="bg-white border border-slate-200/90 rounded-2xl p-3 shadow-2xs space-y-1.5">
        <div class="flex items-center justify-between gap-2">
          <span class="text-xs font-bold text-slate-700">📌 你最近留意過嘅貨品</span>
          <button onclick="clearFootprints()" class="text-[11px] text-slate-400 hover:text-slate-600">清除</button>
        </div>
        <div id="footprint-list" class="space-y-1"></div>
      </div>
    </section>

    <!-- Main Product Cards List -->
    <main class="flex-1 px-3.5 mt-2.5 space-y-2.5" id="cards-container"></main>

    <!-- Bottom Sticky Bar: One-Stop vs Multi-Store Comparison + Field Price Report -->
    <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-200 px-3.5 py-2.5 z-40 shadow-lg">

          <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600 text-sm px-2 py-1">✕</button>
        </div>

        </div>

        <div class="space-y-2 text-xs">

        </div>

        <div id="staging-log-preview" class="bg-emerald-50/70 border border-emerald-200/80 rounded-xl p-2.5 text-[11px] text-slate-700 max-h-28 overflow-y-auto hidden"></div>

        <div class="flex gap-2 pt-1">
          <button onclick="closeReportModal()" class="w-1/2 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">取消</button>
          <button onclick="submitFieldReport()" class="w-1/2 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">確認送出報價</button>
        </div>
      </div>
    </div>

    <!-- Modal 2: Cloud Database Settings -->
    <div id="backend-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-end sm:items-center justify-center p-4 hidden">

            <h3 class="text-sm font-bold text-slate-900">⚙️ 雲端資料庫連線設定</h3>
            <p class="text-[11px] text-slate-500">已預設連通阿偉專屬 Supabase 雲端庫</p>
          </div>
          <button onclick="closeBackendModal()" class="text-slate-400 hover:text-slate-600 text-sm px-2 py-1">✕</button>
        </div>

        <div class="space-y-2.5 text-xs">
          <div>
            <label class="block text-[11px] font-semibold text-slate-700 mb-1">1. Supabase Project URL</label>
            <input type="url" id="supabase-url-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-900 text-xs">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-700 mb-1">2. Supabase Publishable Key</label>
            <input type="text" id="supabase-key-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-900 text-xs font-mono">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-700 mb-1">3. Google Sheet CSV 備用連結 (選填)</label>
            <input type="url" id="csv-url-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-slate-900 text-xs" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
          </div>
        </div>

        <div class="flex gap-2 pt-1">
          <button onclick="closeBackendModal()" class="w-1/2 py-2.5 bg-slate-100 text-slate-700 rounded-xl text-xs font-bold">關閉</button>
          <button onclick="saveBackendConfig()" class="w-1/2 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold">儲存並重新同步</button>
        </div>
      </div>
    </div>

  </div>

    // ============================================================================
    // STATE MANAGEMENT
    // ============================================================================
    var currentArea = 'ALL';
    var currentChain = 'ALL';
    var currentCategory = 'ALL';
    var searchQuery = '';
    var sortMode = 'SAVINGS'; // 'SAVINGS' | 'STORE_PRICE' | 'UNIT_COST'
    var basketState = {};
    var votedState = {};

    PRODUCTS_DATASET.forEach(function(p) {
      basketState[p.id] = false;
      votedState[p.id] = false;
    });

    function safeGetStorage(key, fallback) {
      try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
    }

    function safeSetStorage(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    function showToast(msg) {
      var t = document.getElementById('app-toast');
      var txt = document.getElementById('app-toast-text');
      if (!t || !txt) return;
      txt.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(function() { t.classList.add('hidden'); }, 2500);
    }

    // Get the overall cheapest quote across all stores
    function getOverallBestQuote(product) {
      var best = product.quotes[0];
      product.quotes.forEach(function(q) {
        if (q.unitPrice < best.unitPrice) best = q;
      });
      return best;
    }

    // Get quotes matching the user's selected Area and/or Store Chain
    function getMatchingQuotes(product, areaId, chainId) {
      return product.quotes.filter(function(q) {
        var areaMatch = (areaId === 'ALL') || (q.area === areaId);
        var chainMatch = (chainId === 'ALL') || (q.chain === chainId);
        return areaMatch && chainMatch;
      });
    }

    // Get the representative quote for the user's current view (either selected store/area or overall best)
    function getActiveQuoteForView(product) {
      var matches = getMatchingQuotes(product, currentArea, currentChain);
      if (matches.length === 0) return getOverallBestQuote(product);
      var bestMatch = matches[0];
      matches.forEach(function(q) {
        if (q.unitPrice < bestMatch.unitPrice) bestMatch = q;
      });
      return bestMatch;
    }

    function getProductMaxSavings(product) {
      var best = getOverallBestQuote(product);
      var normTotal = product.marketNormUnit * product.bundleQty;
      var diff = normTotal - best.bundleTotal;
      return diff > 0 ? diff : 0;
    }

    function getChainStyle(chainId) {
      var found = CHAINS_TABLE.find(function(c) { return c.id === chainId; });
      return found ? found.badgeCls : 'bg-slate-100 text-slate-700 border-slate-200';
    }

    // ============================================================================
    // NAVIGATION & FILTER HANDLERS
    // ============================================================================
    function selectArea(areaId) {
      currentArea = areaId;
      renderNavigationBars();
      updateShopperModeBanner();
      renderCards();
      updateBasketSummary();
    }

    function selectChain(chainId) {
      currentChain = chainId;
      renderNavigationBars();
      updateShopperModeBanner();
      renderCards();
      updateBasketSummary();
    }

    function selectCategory(catId) {
      currentCategory = catId;
      renderNavigationBars();
      renderCards();
    }

    function onSearchInput(val) {
      searchQuery = (val || '').trim().toLowerCase();
      renderCards();
    }

    function resetFilters() {
      currentArea = 'ALL';
      currentChain = 'ALL';
      currentCategory = 'ALL';
      searchQuery = '';
      var sInput = document.getElementById('search-input');
      if (sInput) sInput.value = '';
      renderNavigationBars();
      updateShopperModeBanner();
      renderCards();
      updateBasketSummary();
    }

    function cycleSortMode() {
      var modes = ['SAVINGS', 'STORE_PRICE', 'UNIT_COST'];
      var labels = {
        'SAVINGS': '按最抵買',
        'STORE_PRICE': '平價優先',
        'UNIT_COST': '單位成本'
      };
      var nextIdx = (modes.indexOf(sortMode) + 1) % modes.length;
      sortMode = modes[nextIdx];
      var lbl = document.getElementById('sort-label');
      if (lbl) lbl.textContent = labels[sortMode];
      renderCards();
      showToast('已切換排序：' + labels[sortMode]);
    }

    function renderNavigationBars() {
      // 1. Area Bar
      var aBar = document.getElementById('area-bar');
      if (aBar) {
        aBar.innerHTML = '';
        AREAS_TABLE.forEach(function(a) {
          var active = a.id === currentArea;
          var btn = document.createElement('button');
          btn.onclick = function() { selectArea(a.id); };
          btn.className = active
            ? 'px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-900 text-white whitespace-nowrap transition'
            : 'px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200/70 whitespace-nowrap transition';
          btn.textContent = a.label;
          aBar.appendChild(btn);
        });
      }

      // 2. Store Chain Bar
      var chBar = document.getElementById('chain-bar');
      if (chBar) {
        chBar.innerHTML = '';
        CHAINS_TABLE.forEach(function(ch) {
          var active = ch.id === currentChain;
          var btn = document.createElement('button');
          btn.onclick = function() { selectChain(ch.id); };
          btn.className = active
            ? 'px-2.5 py-1 rounded-lg text-xs font-extrabold bg-emerald-600 text-white whitespace-nowrap transition shadow-2xs'
            : 'px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200/70 whitespace-nowrap transition';
          btn.textContent = ch.label;
          chBar.appendChild(btn);
        });
      }

      // 3. Category Bar
      var catBar = document.getElementById('category-bar');
      if (catBar) {
        catBar.innerHTML = '';
        var selectedCount = PRODUCTS_DATASET.filter(function(p) { return basketState[p.id]; }).length;
        CATEGORIES_TABLE.forEach(function(c) {
          var active = c.id === currentCategory;
          var btn = document.createElement('button');
          btn.onclick = function() { selectCategory(c.id); };
          btn.className = active
            ? 'px-2.5 py-1 rounded-lg text-xs font-extrabold bg-slate-800 text-white whitespace-nowrap transition'
            : 'px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100 whitespace-nowrap transition';
          var txt = c.label;
          if (c.id === 'BASKET' && selectedCount > 0) {
            txt = '🛒 已揀 (' + selectedCount + ')';
          }
          btn.textContent = txt;
          catBar.appendChild(btn);
        });
      }

      // 4. Quick Store Chips in Report Modal
      var chipsContainer = document.getElementById('quick-store-chips');
      if (chipsContainer) {
        chipsContainer.innerHTML = '';
        STORES_DIRECTORY.slice(0, 6).forEach(function(st) {
          var chip = document.createElement('button');
          chip.onclick = function() { setQuickReportStore(st.shortName); };
          chip.className = 'px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-xs text-slate-800 font-semibold text-left truncate transition';
          chip.textContent = '📍 ' + st.shortName;
          chipsContainer.appendChild(chip);
        });
      }
    }

    function updateShopperModeBanner() {
      var titleEl = document.getElementById('shopper-mode-title');
      var subEl = document.getElementById('shopper-mode-subtitle');
      var resetBtn = document.getElementById('reset-filter-btn');
      var boxEl = document.getElementById('shopper-mode-box');
      if (!titleEl || !subEl || !resetBtn || !boxEl) return;

      var areaObj = AREAS_TABLE.find(function(a) { return a.id === currentArea; });
      var chainObj = CHAINS_TABLE.find(function(c) { return c.id === currentChain; });

      if (currentArea === 'ALL' && currentChain === 'ALL') {
        resetBtn.classList.add('hidden');
        boxEl.className = 'bg-emerald-50/90 border border-emerald-200/90 rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2';
        titleEl.textContent = '全區格價視角（點上面「水泉澳」或「惠康 / 360 / 759」即變單店指南）';
        subEl.textContent = '不用為慳一蚊走三間舖！揀你身處嘅商舖，即睇邊樣「順手買埋」、邊樣「過隔離舖買」。';
      } else {
        resetBtn.classList.remove('hidden');
        boxEl.className = 'bg-slate-900 text-white rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-2 shadow-xs';
        var areaText = currentArea === 'ALL' ? '沙田四邨' : areaObj.label;
        var chainText = currentChain === 'ALL' ? '所有商舖' : chainObj.label;
        titleEl.className = 'text-xs font-extrabold text-white';
        subEl.className = 'text-[11px] text-slate-300 mt-0.5';
        titleEl.textContent = '📍 正在瀏覽：【' + areaText + ' · ' + chainText + '】專場';
        subEl.textContent = '已列出呢間舖有賣嘅全部貨品，並標示「呢間最抵」、「順手買埋」或「建議過隔離買」！';
      }
    }

    // ============================================================================
    // PRODUCT CARDS RENDERER (Shopper-First Decision Cards)
    // ============================================================================
    function renderCards() {
      var container = document.getElementById('cards-container');
      if (!container) return;
      container.innerHTML = '';

      // Filter products: CRITICAL FIX — show product if ANY of its quotes match the selected Area & Chain!
      var filtered = PRODUCTS_DATASET.filter(function(p) {
        if (currentCategory === 'BASKET' && !basketState[p.id]) return false;
        if (currentCategory !== 'ALL' && currentCategory !== 'BASKET' && p.category !== currentCategory) return false;
        if (searchQuery) {
          var hay = (p.brandName + ' ' + p.title + ' ' + p.spec + ' ' + p.shopperTip).toLowerCase();
          if (hay.indexOf(searchQuery) === -1) return false;
        }
        var matchingQuotes = getMatchingQuotes(p, currentArea, currentChain);
        return matchingQuotes.length > 0;
      });

      filtered.sort(function(a, b) {
        if (sortMode === 'SAVINGS') {
          return getProductMaxSavings(b) - getProductMaxSavings(a);
        } else if (sortMode === 'STORE_PRICE') {
          return getActiveQuoteForView(a).unitPrice - getActiveQuoteForView(b).unitPrice;
        } else {
          return a.normCostPer100 - b.normCostPer100;
        }
      });

      if (filtered.length === 0) {
        var empty = document.createElement('div');
        empty.className = 'bg-white border border-slate-200 rounded-2xl p-8 text-center space-y-2';
        empty.innerHTML =
          '<div class="text-2xl">🔍</div>' +
          '<div class="text-sm font-bold text-slate-700">呢個篩選條件下暫時未有貨品紀錄</div>' +
          '<button onclick="resetFilters()" class="mt-1 px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold">返回全部貨品</button>';
        container.appendChild(empty);
        return;
      }

      var isSingleStoreMode = (currentArea !== 'ALL' || currentChain !== 'ALL');

      filtered.forEach(function(p) {
        var overallBest = getOverallBestQuote(p);
        var activeQuote = getActiveQuoteForView(p);
        var priceDiffUnit = activeQuote.unitPrice - overallBest.unitPrice;
        var priceDiffBundle = activeQuote.bundleTotal - overallBest.bundleTotal;
        var inBasket = basketState[p.id];

        // Compute 3-Tier Human Shopper Verdict Badge when viewing a specific store or overall
        var decisionBadgeHtml = '';
        if (!isSingleStoreMode) {
          var saveVsNorm = (p.marketNormUnit - overallBest.unitPrice) * p.bundleQty;
          if (saveVsNorm > 0) {
            decisionBadgeHtml = '<span class="inline-block text-[11px] font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-lg mt-0.5">最抵慳 $' + saveVsNorm.toFixed(1) + '</span>';
          }
        } else {
          if (priceDiffUnit <= 0.05) {
            decisionBadgeHtml = '<span class="inline-block text-[11px] font-extrabold bg-emerald-600 text-white px-2 py-0.5 rounded-lg mt-0.5">✅ 呢間最抵・即買</span>';
          } else if (priceDiffBundle <= 3.0) {
            decisionBadgeHtml = '<span class="inline-block text-[11px] font-bold bg-sky-50 text-sky-800 border border-sky-200 px-2 py-0.5 rounded-lg mt-0.5">👌 只差 $' + priceDiffUnit.toFixed(1) + '・順手買埋算</span>';
          } else {
            decisionBadgeHtml = '<span class="inline-block text-[11px] font-extrabold bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-lg mt-0.5">⚠️ 貴 $' + priceDiffBundle.toFixed(1) + '・去' + overallBest.storeLabel + '買</span>';
          }
        }

        // Build clean, un-truncated Store Comparison List rows
        var sortedQuotes = p.quotes.slice().sort(function(x, y) { return x.unitPrice - y.unitPrice; });
        var quotesRowsHtml = sortedQuotes.map(function(q, idx) {
          var isCheapest = (idx === 0);
          var isFocusedStore = isSingleStoreMode && (
            (currentArea === 'ALL' || q.area === currentArea) &&
            (currentChain === 'ALL' || q.chain === currentChain)
          );
          var rowBg = isFocusedStore
            ? 'bg-emerald-50/90 border-emerald-400 ring-1 ring-emerald-400/50'
            : (isCheapest ? 'bg-emerald-50/40 border-emerald-200/90' : 'bg-slate-50/80 border-slate-200/70');

          var chainBadgeCls = getChainStyle(q.chain);
          var diffFromBest = q.unitPrice - overallBest.unitPrice;
          var rightTag = '';
          if (isCheapest) {
            rightTag = '<span class="text-[10px] font-extrabold bg-emerald-600 text-white px-1.5 py-0.5 rounded">全場最平</span>';
          } else if (diffFromBest <= 1.5) {
            rightTag = '<span class="text-[10px] font-bold bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded">差 $' + diffFromBest.toFixed(1) + ' 順手買</span>';
          } else {
            rightTag = '<span class="text-[10px] font-bold bg-rose-100 text-rose-700 px-1.5 py-0.5 rounded">貴 $' + diffFromBest.toFixed(1) + '</span>';
          }

          return '<div class="border rounded-xl px-2.5 py-2 flex items-center justify-between gap-2 ' + rowBg + '">' +
            '<div class="flex items-center gap-2 min-w-0">' +
              '<span class="text-[11px] font-extrabold border px-2 py-0.5 rounded-md whitespace-nowrap shrink-0 ' + chainBadgeCls + '">' + q.storeLabel + '</span>' +
              '<span class="text-[11px] text-slate-600 truncate">' + q.note + '</span>' +
            '</div>' +
            '<div class="flex items-center gap-1.5 shrink-0">' +
              rightTag +
              '<span class="text-sm font-black font-mono ' + (isCheapest ? 'text-emerald-700' : 'text-slate-800') + '">$' + q.unitPrice.toFixed(1) + '</span>' +
            '</div>' +
          '</div>';
        }).join('');

        var btnCls = inBasket
          ? 'bg-slate-900 text-white border-slate-900'
          : 'bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-600';
        var btnText = inBasket ? '✓ 已喺採購清單 (點擊移除)' : '＋ 加入今日採購清單';

        var card = document.createElement('article');
        card.className = 'bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-2xs space-y-2.5 transition';
        card.innerHTML =
          '<!-- Card Header: Visual Food Icon + Product Name + Price in Current View -->' +
          '<div class="flex items-start justify-between gap-2.5">' +
            '<div class="flex items-start gap-2.5 min-w-0">' +
              '<div class="w-11 h-11 rounded-2xl bg-slate-100 border border-slate-200/60 flex items-center justify-center text-2xl shrink-0">' +
                p.icon +
              '</div>' +
              '<div class="min-w-0">' +
                '<div class="flex items-center gap-1.5 flex-wrap">' +
                  '<span class="text-xs font-extrabold text-slate-600">' + p.brandName + '</span>' +
                  '<span class="text-slate-300">·</span>' +
                  '<span class="text-[11px] font-semibold text-slate-500">' + p.spec + '</span>' +
                '</div>' +
                '<h3 class="text-base font-black text-slate-900 leading-snug mt-0.5">' + p.title + '</h3>' +
                '<div class="text-[11px] text-slate-400 font-mono mt-0.5">折合 $' + p.normCostPer100.toFixed(2) + ' / ' + p.normUnitName + ' · 重量 ' + p.unitWeightKg.toFixed(2) + 'kg</div>' +
              '</div>' +
            '</div>' +

            '<div class="text-right shrink-0">' +
              '<div class="text-[10px] font-bold text-slate-500 whitespace-nowrap">' + (isSingleStoreMode ? activeQuote.storeLabel : '最抵: ' + overallBest.storeLabel) + '</div>' +
              '<div class="text-xl font-black ' + (priceDiffUnit > 2.0 ? 'text-rose-600' : 'text-emerald-700') + ' font-mono leading-tight">$' + activeQuote.unitPrice.toFixed(1) + '</div>' +
              decisionBadgeHtml +
            '</div>' +
          '</div>' +

          '<!-- Clear Store-by-Store Price Comparison Rows (Zero Truncated Store Names) -->' +
          '<div class="space-y-1.5 pt-0.5">' +
            quotesRowsHtml +
          '</div>' +

          '<!-- Human-Friendly Shopper Tip -->' +
          '<div class="bg-amber-50/70 border border-amber-200/70 rounded-xl px-3 py-2 text-xs text-slate-700 leading-relaxed">' +
            '💡 <b class="text-slate-900">買餸貼士：</b>' + p.shopperTip +
          '</div>' +

          '<!-- Action Buttons -->' +
          '<div class="pt-0.5 flex items-center gap-2">' +
            '<button onclick="toggleBasketItem(\'' + p.id + '\')" class="touch-target flex-1 py-2 px-3 rounded-xl border text-xs font-extrabold whitespace-nowrap transition ' + btnCls + '">' + btnText + '</button>' +
            '<button onclick="verifyStock(\'' + p.id + '\')" class="touch-target py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-xs font-bold text-slate-700 whitespace-nowrap shrink-0 transition">👍 報準 (' + p.verifiedCount + ')</button>' +
            '<button onclick="shareSingleProduct(\'' + p.id + '\')" class="touch-target py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200/80 text-xs font-bold text-slate-700 whitespace-nowrap shrink-0 transition">📤 分享</button>' +
          '</div>';

        container.appendChild(card);
      });
    }

    // ============================================================================
    // SHOPPING BASKET: ONE-STOP vs MULTI-STORE COMPARISON
    // ============================================================================
    function toggleBasketItem(productId) {
      basketState[productId] = !basketState[productId];
      if (basketState[productId]) {
        recordUserFootprint(productId);
      }
      updateBasketSummary();
      renderNavigationBars();
      renderCards();
    }

    function updateBasketSummary() {
      var bestTotalSpend = 0;
      var activeStoreTotalSpend = 0;
      var totalSave = 0;
      var totalWeight = 0;
      var count = 0;
      var isSingleStoreMode = (currentArea !== 'ALL' || currentChain !== 'ALL');

      PRODUCTS_DATASET.forEach(function(p) {
        if (basketState[p.id]) {
          var best = getOverallBestQuote(p);
          var active = getActiveQuoteForView(p);
          bestTotalSpend += best.bundleTotal;
          activeStoreTotalSpend += active.bundleTotal;
          totalSave += getProductMaxSavings(p);
          totalWeight += p.unitWeightKg;
          count += 1;
        }
      });

      var modeLbl = document.getElementById('basket-mode-label');
      var spendEl = document.getElementById('disp-total-spend');
      var saveEl = document.getElementById('disp-total-save');

      if (count === 0) {
        if (modeLbl) modeLbl.textContent = '已揀清單實付';
        if (spendEl) spendEl.textContent = '$0.0';
        if (saveEl) saveEl.textContent = '點擊「＋ 加入今日採購清單」計數';
      } else if (isSingleStoreMode) {
        var extraCostInThisStore = activeStoreTotalSpend - bestTotalSpend;
        if (modeLbl) modeLbl.textContent = '呢間一間買齊';
        if (spendEl) spendEl.textContent = '$' + activeStoreTotalSpend.toFixed(1);
        if (extraCostInThisStore <= 2.0) {
          if (saveEl) saveEl.textContent = '✅ 呢間一間買齊最抵 (只差$' + extraCostInThisStore.toFixed(1) + ')';
        } else {
          if (saveEl) saveEl.textContent = '分店買最抵 $' + bestTotalSpend.toFixed(1) + ' (可再慳$' + extraCostInThisStore.toFixed(1) + ')';
        }
      } else {
        if (modeLbl) modeLbl.textContent = '最抵買齊實付';
        if (spendEl) spendEl.textContent = '$' + bestTotalSpend.toFixed(1);
        if (saveEl) saveEl.textContent = '比常規正價慳 $' + totalSave.toFixed(1);
      }

      document.getElementById('disp-total-weight').textContent = totalWeight.toFixed(1) + ' kg';
      document.getElementById('disp-selected-count').textContent = String(count);

      var loadTag = document.getElementById('ergonomic-load-tag');
      if (loadTag) {
        if (totalWeight === 0) {
          loadTag.textContent = '未揀貨品';
          loadTag.className = 'text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-medium';
        } else if (totalWeight < 3.0) {
          loadTag.textContent = '🟢 單手輕鬆拎';
          loadTag.className = 'text-[10px] bg-emerald-50 text-emerald-700 px-1.5 py-0.5 rounded font-bold';
        } else if (totalWeight < 5.0) {
          loadTag.textContent = '🟡 建議雙手分擔';
          loadTag.className = 'text-[10px] bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded font-bold';
        } else {
          loadTag.textContent = '🔴 逾5kg 宜山上買或推車';
          loadTag.className = 'text-[10px] bg-rose-50 text-rose-700 px-1.5 py-0.5 rounded font-bold';
        }
      }
    }

    // ============================================================================
    // USER FOOTPRINT & STOCK VERIFICATION
    // ============================================================================
    function recordUserFootprint(productId) {
      var p = PRODUCTS_DATASET.find(function(x) { return x.id === productId; });
      if (!p) return;
      var raw = safeGetStorage('002_user_footprints_v3', '[]');
      var list = [];
      try { list = JSON.parse(raw); } catch (e) { list = []; }
      var existingIdx = list.findIndex(function(item) { return item.productId === productId; });
      var best = getOverallBestQuote(p);
      var entry = {
        productId: p.id,
        title: p.icon + ' ' + p.brandName + ' ' + p.title,
        bestStore: best.storeLabel,
        bestPrice: best.unitPrice,
        saveAmount: getProductMaxSavings(p)
      };
      if (existingIdx !== -1) {
        list[existingIdx] = entry;
      } else {
        list.unshift(entry);
      }
      if (list.length > 3) list = list.slice(0, 3);
      safeSetStorage('002_user_footprints_v3', JSON.stringify(list));
      renderFootprints();
    }

    function clearFootprints() {
      safeSetStorage('002_user_footprints_v3', '[]');
      renderFootprints();
      showToast('已清除瀏覽足跡');
    }

    function renderFootprints() {
      var sec = document.getElementById('footprint-section');
      var container = document.getElementById('footprint-list');
      if (!sec || !container) return;
      var raw = safeGetStorage('002_user_footprints_v3', '[]');
      var list = [];
      try { list = JSON.parse(raw); } catch (e) { list = []; }
      if (list.length === 0) {
        sec.classList.add('hidden');
        return;
      }
      sec.classList.remove('hidden');
      container.innerHTML = '';
      list.forEach(function(fp) {
        var row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-slate-50 border border-slate-200/70 rounded-xl px-2.5 py-1.5 text-xs';
        row.innerHTML =
          '<span class="font-bold text-slate-800 truncate pr-2">' + fp.title + '</span>' +
          '<span class="text-emerald-700 font-extrabold whitespace-nowrap shrink-0">最平 ' + fp.bestStore + ' $' + fp.bestPrice.toFixed(1) + '</span>';
        container.appendChild(row);
      });
    }

    function verifyStock(productId) {
      var p = PRODUCTS_DATASET.find(function(x) { return x.id === productId; });
      if (!p) return;
      if (!votedState[productId]) {
        p.verifiedCount += 1;
        votedState[productId] = true;
        recordUserFootprint(productId);
        renderCards();
        showToast('👍 多謝報準！已更新核實人數');
      } else {
        showToast('你今日已確認過呢項價錢');
      }
    }

      if (loc.indexOf('github.io') !== -1) {

    function shareSingleProduct(productId) {
      var p = PRODUCTS_DATASET.find(function(x) { return x.id === productId; });
      if (!p) return;
      recordUserFootprint(productId);
      var best = getOverallBestQuote(p);

    function shareBasketBragCard() {
      var selected = PRODUCTS_DATASET.filter(function(p) { return basketState[p.id]; });
      if (selected.length === 0) {
        showToast('請先喺貨品卡撳「＋ 加入今日採購清單」');
        return;
      }
      var spend = document.getElementById('disp-total-spend').textContent;
      var save = document.getElementById('disp-total-save').textContent;
      var weight = document.getElementById('disp-total-weight').textContent;
      var lines = selected.map(function(p, i) {
        var active = getActiveQuoteForView(p);
        return (i + 1) + '. ' + p.icon + ' ' + p.brandName + p.title + '：' + active.storeLabel + ' $' + active.bundleTotal.toFixed(1) + '/' + p.bundleQty + p.bundleUnit;
      }).join('\n');
      var text = '【今日買餸格價清單】\n' +
        '共 ' + selected.length + ' 樣｜總計 ' + spend + '（' + save + '｜重 ' + weight + '）：\n' +
        lines +
        getShareUrlLine();
      triggerShareOrCopy(text);
    }

    function fallbackCopyText(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('📋 已複製清單文字，可直接貼上至 WhatsApp');
      } catch (e) {
        showToast('已備妥分享文字');
      }
    }

    function triggerShareOrCopy(text) {
      if (navigator && navigator.share) {
        navigator.share({ title: '沙田街坊格價清單', text: text }).catch(function() {
          fallbackCopyText(text);
        });
      } else if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() {
          showToast('📋 已複製清單文字，可直接貼上至 WhatsApp');
        }).catch(function() {
          fallbackCopyText(text);
        });
      } else {
        fallbackCopyText(text);
      }
    }

    function fetchCloudStagingQueue() {
      var box = document.getElementById('staging-log-preview');
      var feedSec = document.getElementById('cloud-feed-section');
      var feedList = document.getElementById('cloud-feed-list');
      var sbUrl = safeGetStorage('002_supabase_url', 'https://wyzwxvmsxsefzhrgvwiy.supabase.co').trim();
      var sbKey = safeGetStorage('002_supabase_key', 'sb_publishable_grfQfwKNjUPqPFKFkuJ2qw_XXCsAew2').trim();
      if (!sbUrl || !sbKey) return;

      var reqHeaders = { 'apikey': sbKey };
      if (sbKey.indexOf('eyJ') === 0) {
        reqHeaders['Authorization'] = 'Bearer ' + sbKey;
      }

      fetch(sbUrl.replace(/\/$/, '') + '/rest/v1/staging_queue?select=staging_id,store_name,report_text,created_at&order=staging_id.desc&limit=8', {
        method: 'GET',
        headers: reqHeaders
      }).then(function(res) {
        if (!res.ok) return null;
        return res.json();
      }).then(function(rows) {
        if (!rows || !Array.isArray(rows)) return;
        var badge = document.getElementById('db-mode-badge');
        if (badge) {
          badge.textContent = '🟢 雲端實時 (' + rows.length + '筆)';
        }
        // 1. Render on Main Screen Live Feed Strip!
        if (feedSec && feedList && rows.length > 0) {
          feedSec.classList.remove('hidden');
          feedList.innerHTML = rows.map(function(r) {
            return '<div class="bg-emerald-50/70 border border-emerald-200/90 rounded-xl px-2.5 py-1.5 shrink-0 max-w-[230px]">' +
              '<div class="text-[10px] font-bold text-emerald-800 truncate">📍 ' + r.store_name + '</div>' +
              '<div class="text-xs font-extrabold text-slate-900 truncate mt-0.5">' + r.report_text + '</div>' +
            '</div>';
          }).join('');
        }
        // 2. Render inside Report Modal
        if (box && rows.length > 0) {
          box.classList.remove('hidden');
          box.innerHTML = '<div class="font-bold text-emerald-800 mb-1">✓ 雲端最新報價紀錄 (' + rows.length + ' 筆)：</div>' +
            rows.slice(0, 4).map(function(r) {
              return '<div>· #' + r.staging_id + ' [' + r.store_name + '] <b>' + r.report_text + '</b></div>';
            }).join('');
        }
      }).catch(function() {});
    }

    function submitFieldReport() {
      var store = document.getElementById('report-store-input').value.trim();
      var text = document.getElementById('report-text-input').value.trim();
      if (!text) {
        showToast('請輸入或用語音講出貨品同價錢');
        return;
      }
      var payload = {
        store_name: store || '未指定門市',
        report_text: text,
        is_verified: false
      };

      var sbUrl = safeGetStorage('002_supabase_url', 'https://wyzwxvmsxsefzhrgvwiy.supabase.co').trim();
      var sbKey = safeGetStorage('002_supabase_key', 'sb_publishable_grfQfwKNjUPqPFKFkuJ2qw_XXCsAew2').trim();
      if (sbUrl && sbKey) {
        var reqHeaders = {
          'Content-Type': 'application/json',
          'apikey': sbKey,
          'Prefer': 'return=representation'
        };
        if (sbKey.indexOf('eyJ') === 0) {
          reqHeaders['Authorization'] = 'Bearer ' + sbKey;
        }
        fetch(sbUrl.replace(/\/$/, '') + '/rest/v1/staging_queue', {
          method: 'POST',
          headers: reqHeaders,
          body: JSON.stringify(payload)
        }).then(function(res) {
          if (!res.ok) {
            return res.text().then(function(errTxt) {
              throw new Error('HTTP ' + res.status + ': ' + errTxt);
            });
          }
          showToast('🎉 報價成功！已即時顯示喺主頁頂部！');
          fetchCloudStagingQueue();
        }).catch(function(err) {
          showToast('雲端寫入失敗 (' + (err && err.message ? err.message.slice(0, 38) : '請檢查網絡') + ')');
        });
      }

      document.getElementById('report-text-input').value = '';
      closeReportModal();
    }

    }

    function closeBackendModal() {
      document.getElementById('backend-modal').classList.add('hidden');
    }

    function saveBackendConfig() {
      var csvUrl = document.getElementById('csv-url-input').value.trim();
      var sbUrl = document.getElementById('supabase-url-input').value.trim();
      var sbKey = document.getElementById('supabase-key-input').value.trim();

      safeSetStorage('002_sheet_csv_url', csvUrl);
      safeSetStorage('002_supabase_url', sbUrl);
      safeSetStorage('002_supabase_key', sbKey);

      closeBackendModal();
      fetchCloudStagingQueue();
      showToast('✓ 已儲存雲端設定並重新同步');
    }

    window.onload = function() {
      renderNavigationBars();
      updateShopperModeBanner();
      renderFootprints();
      renderCards();
      updateBasketSummary();
      fetchCloudStagingQueue();
    };
  </script>
</body>
</html>
