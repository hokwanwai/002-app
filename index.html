    <!-- Sticky Header: Search + Store Filter + Category Filter -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/90 px-3.5 pt-2.5 pb-2 space-y-2 shadow-2xs">
      <!-- Row 1: Friendly Title + Real Data Badge + Search -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0 shrink-0">
          <div class="w-8 h-8 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-base shadow-2xs shrink-0">🛒</div>
          <div>
            <div class="flex items-center gap-1.5">
              <h1 class="text-sm font-extrabold tracking-tight text-slate-900 whitespace-nowrap">沙田街坊格價</h1>
              <span id="db-mode-badge" class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold px-1.5 py-0.5 rounded-md whitespace-nowrap">消委會實價</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 flex-1 max-w-[180px]">
          <input type="search" id="search-input" oninput="onSearchInput(this.value)" placeholder="搜尋熱浪、可樂、米..." class="w-full bg-slate-100 focus:bg-white border border-transparent focus:border-slate-300 rounded-xl px-2.5 py-1.5 text-xs text-slate-800 placeholder:text-slate-400 focus:outline-none transition">

            ⚙️
          </button>
        </div>
      </div>

      <!-- Row 2: 商舖選擇 (點選商舖即睇該舖真實價格) -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
        <span class="text-[11px] font-bold text-slate-400 shrink-0 pr-0.5">商舖:</span>
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar" id="chain-bar"></div>
      </div>

      <!-- Row 3: 貨品分類與排序 -->
      <div class="flex items-center justify-between gap-2 pt-0.5 border-t border-slate-100">
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar" id="category-bar"></div>
        <button onclick="cycleSortMode()" id="sort-btn" class="text-[11px] font-bold text-slate-700 bg-slate-100 hover:bg-slate-200/70 px-2.5 py-1 rounded-lg whitespace-nowrap shrink-0 transition">
          <span id="sort-label">按最平價</span>
        </button>
      </div>
    </header>

    <!-- Source Transparency Notice (消委會官方數據核驗聲明) -->
    <section class="px-3.5 mt-2">
      <div class="bg-slate-100 border border-slate-200/80 rounded-xl px-3 py-1.5 text-[11px] text-slate-600 flex items-center justify-between gap-2">
        <div class="truncate">
          <span>數據來源：</span>
          <a href="https://online-price-watch.consumer.org.hk/opw/topdiff" target="_blank" class="text-emerald-700 font-bold hover:underline">香港消委會《網上格價資訊通》</a>
          <span>及超市官方即時報價</span>
        </div>
        <button onclick="resetFilters()" id="reset-filter-btn" class="hidden text-[10px] font-bold bg-white text-slate-700 border border-slate-200 px-2 py-0.5 rounded shrink-0">重設篩選</button>
      </div>
    </section>

          { chain: 'WELLCOME', storeLabel: '惠康超級市場', unitPrice: 3.19, promoNote: '單件$5.00，買10件$31.90 (平均$3.19/包)' },
          { chain: 'AEON', storeLabel: 'AEON 超市', unitPrice: 3.19, promoNote: '單件$4.90，買10件$31.90 (平均$3.19/包)' },
          { chain: 'MARKET_PLACE', storeLabel: 'Market Place', unitPrice: 3.19, promoNote: '單件$5.00，買10件$31.90 (平均$3.19/包)' }
        ],
        truthInsight: '消委會 2026年10月16日紀錄：買 10 包組合最平係百佳，平均 $2.99/包；惠康與 AEON 平均 $3.19/包，單買一包就要 $4.9–$5.0。'
      },
      {
        id: 'REAL_1664_4PK',
        icon: '🍺',
        category: 'DRINK',
        brandName: '1664 Blanc',
        title: '法國白啤酒 (大罐4罐裝)',
        spec: '500毫升 × 4罐裝',
        unitWeightKg: 2.00,
        sourceUrl: 'https://online-price-watch.consumer.org.hk/opw/product/P000004974',
        officialNormPrice: 72.00,
        quotes: [
          { chain: 'PARKNSHOP', storeLabel: '百佳超級市場', unitPrice: 42.50, promoNote: '單件$61.90，買2件慳$38.80 (平均$42.50/排・平近$30)' },
          { chain: 'AEON', storeLabel: 'AEON 超市', unitPrice: 64.80, promoNote: '單件$72.00，9折後 $64.80' },
          { chain: 'WELLCOME', storeLabel: '惠康超級市場', unitPrice: 72.00, promoNote: '官方常規售價 $72.00 (暫無特價)' },
          { chain: 'MARKET_PLACE', storeLabel: 'Market Place', unitPrice: 72.00, promoNote: '官方常規售價 $72.00' }
        ],
        truthInsight: '消委會 2026年10月12日紀錄：價差極大！百佳買 2 排平均每排只收 $42.50；而惠康正價賣緊 $72.00，買兩排差價近 $60！'
      }
    ];

    // State
    var currentChain = 'ALL';
    var currentCategory = 'ALL';
    var searchQuery = '';
    var sortMode = 'PRICE'; // 'PRICE' | 'SAVINGS'
    var basketState = {};

    REAL_PRODUCTS_DATASET.forEach(function(p) {
      basketState[p.id] = false;
    });

    function safeGetStorage(key, fallback) {
      try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
    }

    function safeSetStorage(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    function showToast(msg) {
      var t = document.getElementById('app-toast');
      var txt = document.getElementById('app-toast-text');
      if (!t || !txt) return;
      txt.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(function() { t.classList.add('hidden'); }, 2500);
    }

    function getBestQuote(p) {
      var b = p.quotes[0];
      p.quotes.forEach(function(q) {
        if (q.unitPrice < b.unitPrice) b = q;
      });
      return b;
    }

    function getChainQuote(p, chainId) {
      if (chainId === 'ALL') return getBestQuote(p);
      var found = p.quotes.find(function(q) { return q.chain === chainId; });
      return found || getBestQuote(p);
    }

    function onSearchInput(val) {
      searchQuery = (val || '').trim().toLowerCase();
      renderCards();
    }

    function selectChain(chainId) {
      currentChain = chainId;
      renderNavigationBars();
      renderCards();
      updateBasketSummary();
    }

    function selectCategory(catId) {
      currentCategory = catId;
      renderNavigationBars();
      renderCards();
    }

    function resetFilters() {
      currentChain = 'ALL';
      currentCategory = 'ALL';
      searchQuery = '';
      var sInput = document.getElementById('search-input');
      if (sInput) sInput.value = '';
      renderNavigationBars();
      renderCards();
      updateBasketSummary();
    }

    function cycleSortMode() {
      sortMode = (sortMode === 'PRICE') ? 'SAVINGS' : 'PRICE';
      var lbl = document.getElementById('sort-label');
      if (lbl) lbl.textContent = (sortMode === 'PRICE') ? '按最平價' : '按慳得最多';
      renderCards();
    }

    function renderNavigationBars() {
      // 1. Chains
      var chBar = document.getElementById('chain-bar');
      if (chBar) {
        chBar.innerHTML = '';
        CHAINS_TABLE.forEach(function(ch) {
          var active = ch.id === currentChain;
          var btn = document.createElement('button');
          btn.onclick = function() { selectChain(ch.id); };
          btn.className = active
            ? 'px-2.5 py-1 rounded-lg text-xs font-black bg-emerald-600 text-white whitespace-nowrap shadow-2xs'
            : 'px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200/70 whitespace-nowrap';
          btn.textContent = ch.label;
          chBar.appendChild(btn);
        });
      }

      // 2. Categories
      var catBar = document.getElementById('category-bar');
      if (catBar) {
        catBar.innerHTML = '';
        var selectedCount = REAL_PRODUCTS_DATASET.filter(function(p) { return basketState[p.id]; }).length;
        CATEGORIES_TABLE.forEach(function(c) {
          var active = c.id === currentCategory;
          var btn = document.createElement('button');
          btn.onclick = function() { selectCategory(c.id); };
          btn.className = active
            ? 'px-2 py-0.5 rounded-md text-xs font-extrabold bg-slate-800 text-white whitespace-nowrap'
            : 'px-2 py-0.5 rounded-md text-xs font-medium text-slate-600 hover:bg-slate-100 whitespace-nowrap';
          var txt = c.label;
          if (c.id === 'BASKET' && selectedCount > 0) {
            txt = '🛒 已選 (' + selectedCount + ')';
          }
          btn.textContent = txt;
          catBar.appendChild(btn);
        });
      }

      var resetBtn = document.getElementById('reset-filter-btn');
      if (resetBtn) {
        if (currentChain !== 'ALL' || currentCategory !== 'ALL' || searchQuery) {
          resetBtn.classList.remove('hidden');
        } else {
          resetBtn.classList.add('hidden');
        }
      }
    }

    function toggleBasket(id) {
      basketState[id] = !basketState[id];
      renderNavigationBars();
      renderCards();
      updateBasketSummary();
    }

    function updateBasketSummary() {
      var spend = 0;
      var save = 0;
      var weight = 0;
      var count = 0;

      REAL_PRODUCTS_DATASET.forEach(function(p) {
        if (basketState[p.id]) {
          var q = getChainQuote(p, currentChain);
          spend += q.unitPrice;
          save += Math.max(0, p.officialNormPrice - q.unitPrice);
          weight += p.unitWeightKg;
          count += 1;
        }
      });

      document.getElementById('disp-total-spend').textContent = '$' + spend.toFixed(1);
      document.getElementById('disp-total-save').textContent = '比常規價慳 $' + save.toFixed(1);
      document.getElementById('disp-total-weight').textContent = weight.toFixed(2) + ' kg';
      document.getElementById('disp-selected-count').textContent = String(count);
    }

    function renderCards() {
      var container = document.getElementById('cards-container');
      if (!container) return;
      container.innerHTML = '';

      var filtered = REAL_PRODUCTS_DATASET.filter(function(p) {
        if (currentCategory === 'BASKET' && !basketState[p.id]) return false;
        if (currentCategory !== 'ALL' && currentCategory !== 'BASKET' && p.category !== currentCategory) return false;
        if (searchQuery) {
          var hay = (p.brandName + ' ' + p.title + ' ' + p.spec + ' ' + p.truthInsight).toLowerCase();
          if (hay.indexOf(searchQuery) === -1) return false;
        }
        return true;
      });

      filtered.sort(function(a, b) {
        var qa = getChainQuote(a, currentChain);
        var qb = getChainQuote(b, currentChain);
        if (sortMode === 'PRICE') {
          return qa.unitPrice - qb.unitPrice;
        } else {
          var sa = a.officialNormPrice - qa.unitPrice;
          var sb = b.officialNormPrice - qb.unitPrice;
          return sb - sa;
        }
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="bg-white p-8 rounded-2xl text-center text-slate-500 text-xs">無符合條件嘅貨品</div>';
        return;
      }

      filtered.forEach(function(p) {
        var overallBest = getBestQuote(p);
        var activeQuote = getChainQuote(p, currentChain);
        var inBasket = basketState[p.id];
        var isSpecificChain = (currentChain !== 'ALL');

        var sortedQuotes = p.quotes.slice().sort(function(x, y) { return x.unitPrice - y.unitPrice; });
        var quoteLinesHtml = sortedQuotes.map(function(q, idx) {
          var isBest = (idx === 0);
          var isCurrent = isSpecificChain && (q.chain === currentChain);
          var rowCls = isCurrent
            ? 'bg-emerald-50/90 border-emerald-400 font-bold'
            : (isBest ? 'bg-emerald-50/40 border-emerald-200' : 'bg-slate-50 border-slate-200/70 text-slate-700');

          return '<div class="border rounded-xl px-2.5 py-1.5 flex items-center justify-between text-xs ' + rowCls + '">' +
            '<div class="flex items-center gap-1.5 min-w-0 pr-1">' +
              '<span class="font-bold shrink-0">' + q.storeLabel + '</span>' +
              '<span class="text-[11px] text-slate-500 truncate">' + q.promoNote + '</span>' +
            '</div>' +
            '<span class="font-extrabold font-mono shrink-0 text-sm ' + (isBest ? 'text-emerald-700' : 'text-slate-800') + '">$' + q.unitPrice.toFixed(2) + '</span>' +
          '</div>';
        }).join('');

        var card = document.createElement('article');
        card.className = 'bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-2xs space-y-2';
        card.innerHTML =
          '<div class="flex items-start justify-between gap-2">' +
            '<div class="flex items-start gap-2.5 min-w-0">' +
              '<div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center text-2xl shrink-0">' + p.icon + '</div>' +
              '<div class="min-w-0">' +
                '<div class="text-[11px] font-bold text-slate-500">' + p.brandName + ' · ' + p.spec + '</div>' +
                '<h3 class="text-sm font-extrabold text-slate-900 leading-snug mt-0.5">' + p.title + '</h3>' +
              '</div>' +
            '</div>' +
            '<div class="text-right shrink-0">' +
              '<div class="text-[10px] text-slate-400">' + (isSpecificChain ? activeQuote.storeLabel : '消委會最低價') + '</div>' +
              '<div class="text-xl font-black text-emerald-700 font-mono leading-tight">$' + activeQuote.unitPrice.toFixed(2) + '</div>' +
            '</div>' +
          '</div>' +

          '<div class="space-y-1 pt-0.5">' + quoteLinesHtml + '</div>' +

          '<div class="bg-amber-50/70 border border-amber-200/70 rounded-xl p-2 text-[11px] text-slate-700 leading-relaxed">' +
            '🔍 <b class="text-slate-900">消委會實證：</b>' + p.truthInsight +
            ' <a href="' + p.sourceUrl + '" target="_blank" class="text-emerald-700 font-bold hover:underline">[消委會官網連結]</a>' +
          '</div>' +

          '<div class="pt-0.5 flex gap-2">' +
            '<button onclick="toggleBasket(\'' + p.id + '\')" class="touch-target flex-1 py-1.5 px-3 rounded-xl text-xs font-bold transition ' + (inBasket ? 'bg-slate-900 text-white' : 'bg-emerald-600 text-white') + '">' +
              (inBasket ? '✓ 已在清單' : '＋ 加入清單') +
            '</button>' +
            '<a href="' + p.sourceUrl + '" target="_blank" class="touch-target py-1.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-700 flex items-center shrink-0">查官方驗證</a>' +
          '</div>';

        container.appendChild(card);
      });
    }

    // ============================================================================
    // SUPABASE INTEGRATION (Live Feed & Reporting)
    // ============================================================================
    function openReportModal() {
      fetchCloudStagingQueue();
      document.getElementById('report-modal').classList.remove('hidden');
    }

    function closeReportModal() {
      document.getElementById('report-modal').classList.add('hidden');
    }

    function setQuickReportStore(name) {
      document.getElementById('report-store-input').value = name;
    }

    function fetchCloudStagingQueue() {
      var box = document.getElementById('staging-log-preview');
      var feedSec = document.getElementById('cloud-feed-section');
      var feedList = document.getElementById('cloud-feed-list');
      var sbUrl = safeGetStorage('002_supabase_url', 'https://wyzwxvmsxsefzhrgvwiy.supabase.co').trim();
      var sbKey = safeGetStorage('002_supabase_key', 'sb_publishable_grfQfwKNjUPqPFKFkuJ2qw_XXCsAew2').trim();
      if (!sbUrl || !sbKey) return;

      var reqHeaders = { 'apikey': sbKey };
      if (sbKey.indexOf('eyJ') === 0) {
        reqHeaders['Authorization'] = 'Bearer ' + sbKey;
      }

      fetch(sbUrl.replace(/\/$/, '') + '/rest/v1/staging_queue?select=staging_id,store_name,report_text,created_at&order=staging_id.desc&limit=6', {
        method: 'GET',
        headers: reqHeaders
      }).then(function(res) {
        if (!res.ok) return null;
        return res.json();
      }).then(function(rows) {
        if (!rows || !Array.isArray(rows)) return;
        if (feedSec && feedList && rows.length > 0) {
          feedSec.classList.remove('hidden');
          feedList.innerHTML = rows.map(function(r) {
            return '<div class="bg-emerald-50 border border-emerald-200 rounded-xl px-2 py-1 shrink-0 text-xs">' +
              '<div class="text-[10px] text-emerald-800 font-bold">' + r.store_name + '</div>' +
              '<div class="font-extrabold text-slate-900">' + r.report_text + '</div>' +
            '</div>';
          }).join('');
        }
        if (box && rows.length > 0) {
          box.classList.remove('hidden');
          box.innerHTML = '<div class="font-bold text-emerald-800 mb-1">雲端已記錄：</div>' +
            rows.slice(0, 3).map(function(r) {
              return '<div>· ' + r.store_name + ': ' + r.report_text + '</div>';
            }).join('');
        }
      }).catch(function() {});
    }

    function submitFieldReport() {
      var store = document.getElementById('report-store-input').value.trim();
      var text = document.getElementById('report-text-input').value.trim();
      if (!text) {
        showToast('請輸入貨品同價錢');
        return;
      }
      var payload = { store_name: store || '未指定門市', report_text: text, is_verified: false };
      var sbUrl = safeGetStorage('002_supabase_url', 'https://wyzwxvmsxsefzhrgvwiy.supabase.co').trim();
      var sbKey = safeGetStorage('002_supabase_key', 'sb_publishable_grfQfwKNjUPqPFKFkuJ2qw_XXCsAew2').trim();

      if (sbUrl && sbKey) {
        var reqHeaders = { 'Content-Type': 'application/json', 'apikey': sbKey, 'Prefer': 'return=representation' };
        if (sbKey.indexOf('eyJ') === 0) reqHeaders['Authorization'] = 'Bearer ' + sbKey;
        fetch(sbUrl.replace(/\/$/, '') + '/rest/v1/staging_queue', {
          method: 'POST',
          headers: reqHeaders,
          body: JSON.stringify(payload)
        }).then(function(res) {
          if (!res.ok) throw new Error('寫入失敗');
          showToast('✓ 成功寫入 Supabase 雲端！');
          fetchCloudStagingQueue();
        }).catch(function() {
          showToast('網絡異常');
        });
      }
      document.getElementById('report-text-input').value = '';
      closeReportModal();
    }

    function openBackendModal() {
      document.getElementById('supabase-url-input').value = safeGetStorage('002_supabase_url', 'https://wyzwxvmsxsefzhrgvwiy.supabase.co');
      document.getElementById('supabase-key-input').value = safeGetStorage('002_supabase_key', 'sb_publishable_grfQfwKNjUPqPFKFkuJ2qw_XXCsAew2');
      document.getElementById('backend-modal').classList.remove('hidden');
    }

    function closeBackendModal() {
      document.getElementById('backend-modal').classList.add('hidden');
    }

    function saveBackendConfig() {
      var sbUrl = document.getElementById('supabase-url-input').value.trim();
      var sbKey = document.getElementById('supabase-key-input').value.trim();
      safeSetStorage('002_supabase_url', sbUrl);
      safeSetStorage('002_supabase_key', sbKey);
      closeBackendModal();
      fetchCloudStagingQueue();
      showToast('✓ 已儲存');
    }

    function shareBasketBragCard() {
      var selected = REAL_PRODUCTS_DATASET.filter(function(p) { return basketState[p.id]; });
      if (selected.length === 0) {
        showToast('請先加入貨品');
        return;
      }
      var spend = document.getElementById('disp-total-spend').textContent;
      var lines = selected.map(function(p, i) {
        var q = getChainQuote(p, currentChain);
        return (i + 1) + '. ' + p.brandName + p.title + '：' + q.storeLabel + ' $' + q.unitPrice.toFixed(2);
      }).join('\n');
      var text = '【沙田街坊格價清單 (消委會官方數據)】\n總計：' + spend + '\n' + lines + '\n來源：https://online-price-watch.consumer.org.hk/';
      if (navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { showToast('已複製清單'); });
      } else {
        showToast('已備妥');
      }
    }

    window.onload = function() {
      renderNavigationBars();
      renderCards();
      updateBasketSummary();
      fetchCloudStagingQueue();
    };
  </script>
</body>
</html>
